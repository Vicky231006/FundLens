services:
  db:
    image: postgres:16
    container_name: fundlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fundlens}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fundlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-fundlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fundlens_pgdata:
